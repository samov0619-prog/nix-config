# Internal panel: user-tested 160% gives an exact 2000x1250 logical workspace.
# Use the panel's advertised 165 Hz; external displays retain the unscaled fallback.
monitor = eDP-2, 3200x2000@165, auto, 1.6
monitor = , preferred, auto, 1
$terminal = kitty
$fileManager = kitty -- env EDITOR=nvim yazi
$fileManagerSudo = kitty --hold sh -c 'exec sudo env EDITOR=nvim "$HOME/.nix-profile/bin/yazi"'
$menu = tofi-launch
$mainMod = SUPER
source = ~/.config/hypr/hypr-spaces.conf

exec-once = uwsm app -- waybar
exec-once = ~/.config/hypr/scripts/terminal-layout-en.sh --focus-watcher
# Reset the session-local toggle together with the configured device on reload.
exec = lenovo-touchpad enable

general {
    gaps_in = 0
    gaps_out = 0
    border_size = 0
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    allow_tearing = false
    layout = dwindle
}
decoration {
    rounding = 0
    rounding_power = 0
    active_opacity = 1.0
    inactive_opacity = 0.9
    shadow {
        enabled = false
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }
    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696
    }
}
animations {
    enabled = yes
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear, 0, 0, 1, 1
    bezier = almostLinear, 0.5, 0.5, 0.75, 1
    bezier = quick, 0.15, 0, 0.1, 1
    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}
dwindle {
    preserve_split = true
}
master {
    new_status = master
}
misc {
    disable_hyprland_logo = true
    on_focus_under_fullscreen = 1
    exit_window_retains_fullscreen = true
    initial_workspace_tracking = 2
    key_press_enables_dpms = true
}
binds {
    movefocus_cycles_fullscreen = 1
}
input {
    kb_layout = us,ru
    kb_options = grp:caps_toggle
    follow_mouse = 1
    repeat_rate = 50
    repeat_delay = 300
    sensitivity = 0
    accel_profile = adaptive
    numlock_by_default = true
    touchpad {
        natural_scroll = false
    }
}
# Native modifiers: no Acer xremap or physical keycap remapping.
device {
    name = gxtp5100:00-27c6:01e7-touchpad
    enabled = true
}
gesture = 3, horizontal, workspace

bind = $mainMod, TAB, spaces:focus-monitor, next
bind = $mainMod SHIFT, TAB, spaces:focus-monitor, previous
bind = $mainMod CTRL, TAB, spaces:move-workspace, next
bind = $mainMod CTRL SHIFT, TAB, spaces:move-workspace, previous
bind = $mainMod SHIFT, P, exec, tofi-passmenu
bind = $mainMod SHIFT, R, exec, voice-dictate
bind = $mainMod, F12, exec, sleep 1 && hyprctl dispatch dpms off
# Lid controls only panel power: no monitor removal, workspace moves or sleep.
bindl = , switch:on:Lid Switch, dpms, off eDP-2
bindl = , switch:off:Lid Switch, dpms, on eDP-2
# Fn exposes ordinary F1/F11; the unmodified top row sends hardware hotkeys.
bind = , F11, exec, ~/.config/hypr/scripts/toggle-theme.sh
bind = , F1, exec, hypr-controls
bind = , XF86Favorites, exec, agent-todo-open
bind = , XF86TouchpadToggle, exec, lenovo-touchpad toggle
bind = $mainMod SHIFT, ESCAPE, exec, tofi-sessionmenu
bind = , PRINT, exec, hypr-screenshot-region
bind = $mainMod SHIFT, E, exec, $fileManagerSudo
bind = $mainMod, M, fullscreen, 1
bind = $mainMod, F, focuswindow, floating
bind = $mainMod SHIFT, F, focuswindow, tiled
bind = $mainMod, T, layoutmsg, togglesplit
bind = $mainMod CTRL, T, layoutmsg, splitratio 1 exact
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d
bind = $mainMod, 0x2c, exec, $terminal
bind = $mainMod, N, exec, $terminal -- nvim
bind = $mainMod, W, exec, hypr-semantic-switcher-tofi
bind = $mainMod, SPACE, spaces:toggle
bind = $mainMod, Q, killactive
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, G, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod, P, pseudo,
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bindm = $mainMod, mouse:272, movewindow
# Native resize: floating geometry or Dwindle split ratios; no border required.
bindm = $mainMod SHIFT, mouse:272, resizewindow
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
# The internal panel uses Intel; automatic selection picks nvidia_0 instead.
bindel = , XF86MonBrightnessUp, exec, brightnessctl --device=intel_backlight -e4 -n2 set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl --device=intel_backlight -e4 -n2 set 5%-
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

windowrule = tile on, match:class ^cpw-mods-bootstraplauncher-BootstrapLauncher$
windowrule = suppress_event maximize, match:class .*
windowrule = no_focus on, match:class ^$, match:title ^$, match:xwayland 1, match:float 1, match:fullscreen 0
windowrule = center on, match:class Ardour.*, match:title (Session Setup|)
windowrule = float on, match:class ^(calendar-popup)$
# Do not inherit Acer's absolute calendar coordinates/size.
windowrule = workspace special:tg, match:class ^(org.telegram.desktop)$
bind = ALT, Space, submap, apps
submap = apps
bind = , t, togglespecialworkspace, tg
bind = , t, submap, reset
bind = , escape, submap, reset
submap = reset

# Preserve the existing Russian-layout aliases for common window controls.
bind = $mainMod SHIFT, З, exec, tofi-passmenu
bind = $mainMod SHIFT, У, exec, $fileManagerSudo
bind = $mainMod, Ь, fullscreen, 1
bind = $mainMod SHIFT, А, exec, firefox
bind = $mainMod SHIFT, Я, exec, zoom
bind = $mainMod, Е, layoutmsg, togglesplit
bind = $mainMod SHIFT, Р, movewindow, l
bind = $mainMod SHIFT, Д, movewindow, r
bind = $mainMod SHIFT, Л, movewindow, u
bind = $mainMod SHIFT, О, movewindow, d
bind = $mainMod, Р, movefocus, l
bind = $mainMod, Д, movefocus, r
bind = $mainMod, Л, movefocus, u
bind = $mainMod, О, movefocus, d
bind = $mainMod, Й, exec, $terminal
bind = $mainMod, Т, exec, $terminal -- nvim
bind = $mainMod, Ц, exec, hypr-semantic-switcher-tofi
bind = $mainMod, С, killactive,
bind = $mainMod, У, exec, $fileManager
bind = $mainMod, П, togglefloating,
bind = $mainMod, К, exec, $menu
bind = $mainMod, З, pseudo,
bind = $mainMod, Ы, togglespecialworkspace, magic
bind = $mainMod SHIFT, Ы, movetoworkspace, special:magic
