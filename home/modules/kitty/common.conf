# Shared terminal behavior.
font_family family="NotoSansM Nerd Font Mono"
bold_font auto
italic_font auto
bold_italic_font auto
font_size 14.0
symbol_map U+E5FA-U+E6AC Symbols Nerd Font Mono
symbol_map U+E700-U+E7C5 Symbols Nerd Font Mono
symbol_map U+F000-U+F2E0 Symbols Nerd Font Mono
symbol_map U+E200-U+E2A9 Symbols Nerd Font Mono
symbol_map U+F0001-U+F1AF0 Symbols Nerd Font Mono
symbol_map U+E300-U+E3E3 Symbols Nerd Font Mono
symbol_map U+F400-U+F532,U+2665,U+26A1 Symbols Nerd Font Mono
symbol_map U+E0A0-U+E0A2,U+E0B0-U+E0B3 Symbols Nerd Font Mono
symbol_map U+E0A3,U+E0B4-U+E0C8,U+E0CA,U+E0CC-U+E0D4 Symbols Nerd Font Mono
symbol_map U+23FB-U+23FE,U+2B58 Symbols Nerd Font Mono
symbol_map U+F300-U+F32F Symbols Nerd Font Mono
symbol_map U+E000-U+E00A Symbols Nerd Font Mono
symbol_map U+EA60-U+EBEB Symbols Nerd Font Mono
symbol_map U+E276C-U+E2771 Symbols Nerd Font Mono
symbol_map U+2500-U+259F Symbols Nerd Font Mono
symbol_map U+F102,U+F116-U+F118,U+F12F,U+F13E,U+F1AF,U+F1BF,U+F1CF,U+F1FF,U+F20F,U+F21F-U+F220,U+F22E-U+F22F,U+F23F,U+F24F,U+F25F nonicons
symbol_map U+1F600-U+1F64F Noto Color Emoji

background #2C2E34
cursor_trail 1
scrollback_lines 10000
scrollback_pager nvim --clean
enabled_layouts grid
window_border_width 1px
draw_minimal_borders no
window_margin_width 0
window_padding_width 4
placement_strategy center
inactive_border_color #cccccc
window_title_bar_min_windows 2
window_title_bar_align left
confirm_os_window_close 0
tab_bar_style powerline
tab_bar_edge top
shell fish
allow_remote_control yes
enable_audio_bell yes

# New tabs start at home; Shift OS-window launches keep the active cwd.
map --allow-fallback=shifted,ascii super+, launch --type=tab --cwd=~
map --allow-fallback=shifted,ascii super+shift+, launch --type=os-window --cwd=current
map --allow-fallback=shifted,ascii super+e launch --type=tab --cwd=~ env EDITOR=nvim yazi
map --allow-fallback=shifted,ascii super+shift+e launch --type=os-window --cwd=current env EDITOR=nvim yazi
map --allow-fallback=shifted,ascii super+n launch --type=tab --cwd=~ nvim
map --allow-fallback=shifted,ascii super+shift+n launch --type=os-window --cwd=current nvim
map --allow-fallback=shifted,ascii super+w close_tab
map --allow-fallback=shifted,ascii super+] next_tab
map --allow-fallback=shifted,ascii super+[ previous_tab
map --allow-fallback=shifted,ascii super+shift+[ move_tab_backward
map --allow-fallback=shifted,ascii super+shift+] move_tab_forward
